# Render Blueprint — one-click staging for KirokuMichi
# Dashboard: New → Blueprint → connect this repo → select render.yaml
# Secrets use sync:false so Render prompts for values on first create only.
# Do not put real secrets in this file.
services:
  - type: web
    name: kirokumichi-staging
    runtime: node
    rootDir: app
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Non-secret defaults (safe to commit)
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # trust proxy is also auto-enabled when NODE_ENV=production (see server/index.ts)
      - key: TRUST_PROXY
        value: "1"
      - key: SENTRY_ENVIRONMENT
        value: staging
      - key: VITE_SENTRY_ENVIRONMENT
        value: staging
      - key: AZURE_TTS_REGION
        value: eastus

      # Required for closed beta + PDF + reports (prompted on Blueprint create)
      - key: BETA_INVITE_CODES
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GITHUB_REPORT_REPO
        sync: false
      - key: GITHUB_REPORT_TOKEN
        sync: false

      # At least one hosted AI provider (or testers enter their own key in Settings)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

      # Optional custom OpenAI-compatible provider
      - key: CUSTOM_PROVIDER_API_KEY
        sync: false
      - key: CUSTOM_PROVIDER_ENDPOINT
        sync: false
      - key: CUSTOM_PROVIDER_ENDPOINTS
        sync: false
      - key: AI_MODEL_ALLOWLIST
        sync: false

      # TTS (optional)
      - key: AZURE_TTS_KEY
        sync: false

      # Split-origin / CSRF (usually leave empty for single-origin Render)
      - key: PUBLIC_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false

      # Observability (optional)
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_RELEASE
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_RELEASE
        sync: false
