name: Verify

on:
  push:
  pull_request:

jobs:
  staging-config:
    name: Staging config gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate staging artifacts
        # Offline only — no live staging URL / Render deploy from CI
        run: npm run staging:validate-config

  app:
    name: App health gate
    # Pin 24.04: playwright browser deps lag newest ubuntu-latest images.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    env:
      PLAYWRIGHT_CHANNEL: bundled
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify app
        run: npm run verify
